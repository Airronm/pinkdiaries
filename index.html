<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>The Pink Diaries</title>
    <style>
        /* CSS resets required to make MOAP fill the entire prim perfectly */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            background-color: #ffe4e1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .header {
            background-color: #ff69b4;
            color: white;
            padding: 18px;
            text-align: center;
            font-weight: 800;
            font-size: 26px;
            letter-spacing: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .content {
            flex-grow: 1;
            overflow-y: auto; /* Allow scrolling inside the content area */
            padding: 15px;
        }

        .entry {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #ff69b4;
        }

        .entry-cat {
            font-size: 11px;
            color: #ff1493;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .entry-text {
            font-size: 16px;
            margin-bottom: 12px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .entry-meta {
            font-size: 13px;
            color: #888;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: #ff1493;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #ff1493;
            color: #ff1493;
        }

        .btn:active, .btn-outline:active {
            opacity: 0.7;
        }

        .tabs {
            display: flex;
            background: #fff;
            border-top: 1px solid #ffb6c1;
            z-index: 10;
        }

        .tab {
            flex: 1;
            padding: 18px 0;
            text-align: center;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            color: #ffb6c1;
            border-top: 4px solid transparent;
            transition: all 0.2s;
        }

        .tab.active {
            border-top: 4px solid #ff1493;
            color: #ff1493;
            background: #fffafa;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .submit-msg {
            text-align: center;
            margin-top: 60px;
            font-size: 18px;
            color: #ff1493;
            font-weight: bold;
            padding: 20px;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255, 228, 225, 0.8);
            z-index: 999;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            color: #ff1493;
        }
    </style>
</head>
<body>
    <div class="header">PINK DIARIES</div>
    <div id="content" class="content"></div>
    <div class="tabs">
        <div id="tab-read" class="tab" onclick="go('tab', 't=read')">LATEST</div>
        <div id="tab-featured" class="tab" onclick="go('tab', 't=featured')">HOT TEA</div>
        <div id="tab-submit" class="tab" onclick="go('submit', '')">SPILL</div>
    </div>
    <div id="loading" class="loading-overlay">Loading...</div>

    <script>
        let cb = ""; // Callback URL to SL

        // Shows visual feedback while waiting for LSL to execute the JS redirect
        function showLoading() { document.getElementById('loading').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loading').style.display = 'none'; }

        // The Becky Pippen Script Injection Function
        function go(action, extra) {
            if (!cb) return false;
            showLoading();
            
            // Build the HTTP-in request URL
            let u = cb + (cb.indexOf('?') > -1 ? '&' : '?') + 'action=' + action;
            if (extra) u += '&' + extra;
            u += '&_=' + Date.now(); // Cache busting

            // Inject the script tag. LSL will respond with window.location.replace()
            let scriptTag = document.createElement('script');
            scriptTag.src = u;
            document.body.appendChild(scriptTag);
            
            // Clean up the DOM block after use
            setTimeout(() => { if(scriptTag.parentNode) scriptTag.parentNode.removeChild(scriptTag); }, 2000);
            
            // Fail-safe in case the region is lagging or drops the HTTP request
            setTimeout(hideLoading, 4000);
            return false;
        }

        // Render the UI directly from the Base64 Hash string
        function render() {
            hideLoading();
            const params = new URLSearchParams(window.location.search);
            cb = params.get('cb') || "";

            let hash = window.location.hash.substring(1);
            if (!hash) return;
            
            let data;
            try {
                // Decode UTF-8 Base64 properly
                data = JSON.parse(decodeURIComponent(escape(atob(hash))));
            } catch(e) {
                console.error("Failed to parse LSL JSON", e);
                return;
            }

            // Update Tab State
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            let tabId = data.tab === 'detail' ? 'read' : data.tab;
            let activeTabEl = document.getElementById('tab-' + tabId);
            if (activeTabEl) activeTabEl.classList.add('active');

            let html = "";
            let content = document.getElementById('content');

            if (data.tab === "submit") {
                html = "<div class='submit-msg'>Look at your Local Chat/Dialog menu to spill your tea! ☕</div>";
            } 
            else if (data.tab === "detail") {
                if(data.entry) {
                    html += `
                        <button class="btn btn-outline" onclick="go('tab', 't=${data.m === 'featured' ? 'featured' : 'read'}')">🔙 Back</button>
                        <div class="entry" style="margin-top: 15px;">
                            <div class="entry-cat">${data.entry.c}</div>
                            <div class="entry-text">${data.entry.t}</div>
                            <div class="entry-meta">
                                <span>🕒 ${data.entry.a}</span>
                                <span>❤️ ${data.entry.l} Likes</span>
                            </div>
                        </div>
                    `;
                } else {
                    html = "<div style='text-align:center; padding: 20px;'>Entry not found.</div><button class='btn btn-outline' onclick=\"go('tab', 't=read')\">🔙 Back</button>";
                }
            } 
            else {
                // Feed View
                if (data.e && data.e.length > 0) {
                    data.e.forEach(entry => {
                        html += `
                            <div class="entry">
                                <div class="entry-cat">${entry.c}</div>
                                <div class="entry-text">${entry.t}</div>
                                <div class="entry-meta">
                                    <span>🕒 ${entry.a}</span>
                                    <div>
                                        <button class="btn btn-outline" style="padding: 4px 10px;" onclick="go('like', 'id=${entry.i}')">❤️ ${entry.l}</button>
                                        <button class="btn" style="padding: 4px 10px; margin-left: 5px;" onclick="go('view', 'id=${entry.i}')">View</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    
                    html += `<div class="pagination">`;
                    if (data.p > 1) {
                        html += `<button class="btn btn-outline" onclick="go('prev', '')">⬅️ Prev</button>`;
                    } else {
                        html += `<div></div>`;
                    }
                    if (data.e.length === 4) { // Matches LSL ENTRIES_PER_PAGE
                        html += `<button class="btn btn-outline" onclick="go('next', '')">Next ➡️</button>`;
                    }
                    html += `</div>`;
                } else {
                    html += `<div style="text-align:center; color:#888; margin-top:40px; font-weight:bold;">No tea to sip right now.</div>`;
                    if (data.p > 1) {
                        html += `<div class="pagination" style="justify-content: center;"><button class="btn btn-outline" onclick="go('prev', '')">⬅️ Go Back</button></div>`;
                    }
                }
            }

            content.innerHTML = html;
            // Scroll back to top on render
            content.scrollTop = 0; 
        }

        // MOAP doesn't trigger standard load events well, so we bind to both
        window.addEventListener("hashchange", render);
        window.addEventListener("DOMContentLoaded", render);
        
        // Initial render trigger
        if(window.location.hash) render();
    </script>
</body>
</html>
